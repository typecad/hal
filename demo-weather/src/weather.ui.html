<screen id="weather">
  <body>
    <header id="header">
      <text id="title">Weather Station</text>
      <text id="subtitle">BME688 sensor</text>
    </header>

    <!-- Row 1: Temperature | Humidity -->
    <div class="row">
      <section class="card">
        <text class="label">Temperature</text>
        <text id="tempText" class="value">--</text>
        <progress id="tempBar" value="0"></progress>
      </section>
      <section class="card">
        <text class="label">Humidity</text>
        <text id="humText" class="value">--</text>
        <progress id="humBar" value="0"></progress>
      </section>
    </div>

    <!-- Row 2: Pressure | Gas -->
    <div class="row">
      <section class="card">
        <text class="label">Pressure</text>
        <text id="presText" class="value">--</text>
        <progress id="presBar" value="0"></progress>
      </section>
      <section class="card">
        <text class="label">Gas</text>
        <text id="gasText" class="value">--</text>
        <progress id="gasBar" value="0"></progress>
      </section>
    </div>

    <!-- Canvas gauge -->
    <canvas id="gauge" width="200" height="60"></canvas>
  </body>
</screen>

<style>
:root {
  --background: #111418;
  --foreground: #f7f3e8;
  --card: #1c2228;
  --card-foreground: #f7f3e8;
  --primary: #ff765c;
  --primary-foreground: #111418;
  --secondary: #f6c84c;
  --muted: #29313a;
  --muted-foreground: #b9c3c8;
  --accent: #43d2c8;
  --accent-foreground: #071012;
  --destructive: #f7f3e8;
  --destructive-foreground: #111418;
  --border: #f6c84c;
  --radius: 6px;
  --shadow: 3px 3px 0px 0px hsl(0 0% 0% / 1.00);
}

screen {
  background: var(--background);
  flex-direction: column;
  gap: 6px;
  padding: 8px;
}

#header {
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: 1px solid var(--border);
  background: var(--card);
  padding: 6px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
#title {
  color: var(--foreground);
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}
#subtitle {
  color: var(--muted-foreground);
  font-size: 12px;
  text-align: center;
}

.row {
  flex-direction: row;
  gap: 6px;
  align-items: stretch;
}

.card {
  flex: 1;
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  box-shadow: var(--shadow);
}
.label {
  color: var(--secondary);
  font-size: 12px;
}
.value {
  color: var(--foreground);
  font-size: 18px;
  font-weight: bold;
}
#gauge {
  background: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
</style>
