<link rel="stylesheet" href="hello.ui.css">

<screen>
  <view id="header">
    <text id="title">typeCAD UI</text>
    <text id="subtitle">flex demo</text>
  </view>
  <view id="body">
    <text id="counter">0</text>
    <button id="btn">Press</button>
    <view id="ledRow">
      <view id="ledBox"></view>
      <text id="ledLabel">Enable LED</text>
    </view>
    <view id="modeRow">
      <text id="modeLabel">Mode:</text>
      <text id="modeValue">Auto</text>
    </view>
  </view>
  <view id="footer">
    <text id="hint">4:count 5:led 15:mode</text>
  </view>
</screen>
