<link rel="stylesheet" href="hello.ui.css">

<screen>
  <view id="header">
    <text id="title">typeCAD UI</text>
    <text id="subtitle">elements demo</text>
  </view>
  <view id="body">
    <text id="counter">0</text>
    <button id="btn">Press</button>
    <check id="led">Enable LED</check>
    <view id="modeRow">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="auto">Auto</option>
        <option value="manual">Manual</option>
        <option value="off">Off</option>
      </select>
    </view>
    <view id="speedRow">
      <radio id="speedSlow" name="speed" value="slow">Slow</radio>
      <radio id="speedFast" name="speed" value="fast" checked>Fast</radio>
    </view>
  </view>
  <view id="listContainer">
    <text id="item1">Item 1</text>
    <text id="item2">Item 2</text>
    <text id="item3">Item 3</text>
    <text id="item4">Item 4</text>
    <text id="item5">Item 5</text>
    <text id="item6">Item 6</text>
    <text id="item7">Item 7</text>
    <text id="item8">Item 8</text>
  </view>
  <view id="footer">
    <text id="hint">Tap / drag to scroll</text>
  </view>
</screen>
