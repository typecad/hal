<link rel="stylesheet" href="hello.ui.css">

<screen id="home">
  <view id="header">
    <text id="title">typeCAD UI</text>
    <text id="subtitle">elements demo</text>
  </view>
  <view id="body">
    <text id="counter">0</text>
    <button id="btn">Press</button>
    <check id="led">Enable LED</check>
    <view id="modeRow">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="auto">Auto</option>
        <option value="manual">Manual</option>
        <option value="off">Off</option>
      </select>
    </view>
    <view id="speedRow">
      <radio id="speedSlow" name="speed" value="slow">Slow</radio>
      <radio id="speedFast" name="speed" value="fast" checked>Fast</radio>
    </view>
    <progress id="progress" value="0"></progress>

    <view id="rangeRow">
      <label for="points">Points</label>
      <range id="points" name="points" min="0" max="10" value="0"></range>
    </view>

    <view id="inputRow">
      <label for="ssid">SSID:</label>
      <input id="ssid" type="text" placeholder="Network" maxlength="32"></input>
    </view>

    <view id="portRow">
      <label for="port">Port:</label>
      <input id="port" type="number" placeholder="8080" maxlength="5"></input>
    </view>

    <text id="item1">Item 1</text>
    <text id="item2">Item 2</text>
    <text id="item3">Item 3</text>
    <text id="item4">Item 4</text>
    <text id="item5">Item 5</text>
    <text id="item6">Item 6</text>
    <text id="item7">Item 7</text>
    <text id="item8">Item 8</text>

    <a id="goSettings" href="#settings">Settings ></a>
    <a id="goAbout" href="#about">About ></a>
  </view>

  <view id="footer">
    <text id="hint">Tap / drag to scroll</text>
  </view>
</screen>

<screen id="settings">
  <view id="settingsHeader">
    <text id="settingsTitle">Settings</text>
  </view>
  <view id="settingsBody">
    <text id="settingsLabel">Device Configuration</text>
    <a id="backFromSettings" href="#home">&lt; Back</a>
    <a id="settingsToAbout" href="#about">About ></a>
  </view>
</screen>

<screen id="about">
  <view id="aboutHeader">
    <text id="aboutTitle">About</text>
  </view>
  <view id="aboutBody">
    <img id="logo" src="test-logo.img" width="32" height="32"></img>
    <text id="aboutVersion">TypeHAL UI v1.0</text>
    <text id="aboutDesc">ESP32 Display Library</text>
    <a id="backFromAbout" href="#home">&lt; Back</a>
  </view>
</screen>
