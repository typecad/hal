<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --inv-bg: #ffffff;
    --inv-fg: #000000;
  }

  screen {
    background: var(--bg);
    color: var(--fg);
    padding: 0;
    gap: 0;
  }

  body {
    gap: 2px;
    align-items: center;
  }

  #top {
    width: 128px;
    height: 10px;
    background: var(--inv-bg);
    color: var(--inv-fg);
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 1px 2px;
  }

  #brand {
    width: 76px;
    color: var(--inv-fg);
    font-size: 8px;
    text-align: left;
  }

  #monoBadge {
    width: 32px;
    height: 8px;
    color: var(--inv-fg);
    background: var(--inv-bg);
    font-size: 8px;
    text-align: center;
  }

  @media (monochrome) {
    #monoBadge {
      color: var(--fg);
      background: var(--bg);
    }
  }

  #main {
    width: 128px;
    height: 52px;
    flex-direction: row;
    gap: 2px;
    padding: 0 1px;
  }

  .panel {
    width: 62px;
    height: 52px;
    border: 1px solid var(--fg);
    padding: 1px;
    gap: 1px;
  }

  .panelTitle {
    width: 58px;
    height: 8px;
    color: var(--fg);
    font-size: 8px;
    text-align: center;
  }

  #scope {
    width: 58px;
    height: 40px;
  }

  #shapeRow {
    width: 58px;
    height: 12px;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  #fillBox {
    width: 8px;
    height: 8px;
    background: var(--fg);
  }

  #outlineBox {
    width: 8px;
    height: 8px;
    border: 1px solid var(--fg);
  }

  #roundBox {
    width: 9px;
    height: 9px;
    border: 1px solid var(--fg);
    border-radius: 4px;
  }

  #hLine {
    width: 14px;
    height: 1px;
    background: var(--fg);
  }

  #load {
    width: 56px;
    height: 10px;
    color: var(--fg);
    background: var(--bg);
  }

  #alignRow {
    width: 58px;
    height: 8px;
    flex-direction: row;
    gap: 1px;
  }

  .alignCell {
    width: 18px;
    height: 8px;
    color: var(--fg);
    font-size: 8px;
  }

  #alignLeft {
    text-align: left;
  }

  #alignCenter {
    text-align: center;
  }

  #alignRight {
    text-align: right;
  }
</style>

<screen id="home">
  <body>
    <div id="top">
      <span id="brand">TypeCAD OLED</span>
      <span id="monoBadge">MONO</span>
    </div>

    <div id="main">
      <div id="canvasPanel" class="panel">
        <span class="panelTitle">canvas</span>
        <canvas id="scope" width="58" height="40"></canvas>
      </div>

      <div id="layoutPanel" class="panel">
        <span class="panelTitle">layout</span>
        <div id="shapeRow">
          <div id="fillBox"></div>
          <div id="outlineBox"></div>
          <div id="roundBox"></div>
          <div id="hLine"></div>
        </div>
        <progress id="load" value="0"></progress>
        <div id="alignRow">
          <span id="alignLeft" class="alignCell">L</span>
          <span id="alignCenter" class="alignCell">C</span>
          <span id="alignRight" class="alignCell">R</span>
        </div>
      </div>
    </div>
  </body>
</screen>
