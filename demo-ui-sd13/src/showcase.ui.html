<style>
  screen {
    background: #000000;
    color: #ffffff;
    padding: 0;
    gap: 0;
  }

  .title {
    color: #ffffff;
    font-size: 12px;
    font-weight: normal;
    text-align: center;
    padding: 1px 0;
  }

  .subtitle {
    color: #ffffff;
    font-size: 8px;
    text-align: center;
  }

  .sectionLabel {
    color: #ffffff;
    font-size: 8px;
    padding: 0 2px;
  }

  .shapeRow {
    flex-direction: row;
    align-items: center;
    gap: 3px;
    padding: 1px 2px;
  }

  .box {
    background: #ffffff;
  }

  .boxOutline {
    border: 1px solid #ffffff;
  }

  .circle {
    border: 1px solid #ffffff;
    border-radius: 6px;
  }

  .line {
    background: #ffffff;
  }

  .textLeft {
    color: #ffffff;
    font-size: 8px;
    padding: 0 2px;
  }

  .textCenter {
    color: #ffffff;
    font-size: 8px;
    text-align: center;
    width: 120px;
  }

  .textRight {
    color: #ffffff;
    font-size: 8px;
    text-align: right;
    width: 120px;
  }

  .countDisplay {
    color: #ffffff;
    font-size: 10px;
    text-align: center;
    padding: 1px 0;
  }

  .separator {
    background: #ffffff;
    height: 1px;
    width: 124px;
  }
</style>

<screen id="home">
  <body>
    <!-- Title bar -->
    <div class="title">OLED Demo</div>
    <div class="subtitle">128x64 SSD1309</div>

    <!-- Separator line -->
    <div class="separator" style="margin: 1px auto;"></div>

    <!-- Shapes row: filled box, outlined box, circle -->
    <div class="shapeRow" style="justify-content: center;">
      <div class="box" style="width: 8px; height: 8px;"></div>
      <div class="boxOutline" style="width: 8px; height: 8px;"></div>
      <div class="circle" style="width: 10px; height: 10px;"></div>
      <div class="line" style="width: 16px; height: 1px;"></div>
      <div class="line" style="width: 1px; height: 8px;"></div>
    </div>

    <!-- Separator -->
    <div class="separator" style="margin: 1px auto;"></div>

    <!-- Text alignment samples -->
    <div class="textLeft">Left text</div>
    <div class="textCenter">Center text</div>
    <div class="textRight">Right text</div>

    <!-- Separator -->
    <div class="separator" style="margin: 1px auto;"></div>

    <!-- Reactive counter (auto-incrementing) -->
    <div class="countDisplay">count: {count}</div>
  </body>
</screen>
