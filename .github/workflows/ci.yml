name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Covers the engines.node >=22.11.0 claim across the supported LTS
        # lines. Node 22.11 is the floor (oldest non-EOL LTS, also the
        # minimum for @changesets/cli@3); Node 24 is the active LTS.
        node-version: ['22.11', 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build all packages
        run: npm run build --workspaces
